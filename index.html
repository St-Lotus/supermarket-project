<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST. LOTUS SUPERMARKET - Inventory</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* CSS Custom Styles */
        .product-card { 
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .product-card:hover { 
            transform: scale(1.03);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
        .vendor-sidebar { 
            position: sticky; 
            top: 70px; 
        }
        .card-img-top {
            height: 140px !important;
            object-fit: contain;
            background-color: #f8f9fa;
        }
        .card-title-area {
            min-height: 42px; /* စာတန်းရှည်ရင် ကတ်အမြင့်ချင်း ညီနေအောင် ထိန်းပေးရန် */
        }
    </style>
</head>
<body class="bg-light">

<!-- ၁။ Navbar (Company Name & Logo) -->
<nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <!-- Logo နေရာမှာ ကိုယ့် Logo link ထည့်ပါ -->
            <img src="https://via.placeholder.com/40" alt="Logo" width="40" height="40" class="d-inline-block align-text-top me-2 rounded">
            <strong>ST. LOTUS SUPERMARKET</strong>
        </a>
    </div>
</nav>

<!-- Dashboard Wrapper (Fluid Layout သုံးထားလို့ ဘေးနှစ်ဖက် ညှိပြီးသားဖြစ်ပါမယ်) -->
<div class="container-fluid px-4 mt-4">
    <div class="row">
        
        <!-- ၂။ Sidebar (Main Vendors List) -->
        <div class="col-xl-2 col-md-3 mb-4">
            <div class="vendor-sidebar">
                <h5 class="fw-bold text-muted mb-3" style="font-size: 1.1rem;">Main Vendors</h5>
                <div class="list-group shadow-sm" id="vendorList">
                    <!-- JavaScript က Vendor Button တွေကို ဒီထဲမှာ အလိုအလျောက် ထည့်ပေးပါလိမ့်မယ် -->
                    <button class="list-group-item list-group-item-action active" onclick="filterVendor('all')">အားလုံး</button>
                </div>
            </div>
        </div>

        <!-- ၃။ Main Content (Search Bar & Product Cards) -->
        <div class="col-xl-10 col-md-9">
            
            <!-- Search Bar -->
            <div class="input-group mb-4 shadow-sm">
                <span class="input-group-text bg-white border-end-0">🔍</span>
                <input type="text" id="searchInput" class="form-control border-start-0 py-2" placeholder="အမည် (သို့) ကုတ် (သို့) အစစာလုံးဖြင့် ရှာရန်..." onkeyup="searchProduct()">
            </div>

            <!-- Products Grid (တစ်တန်းမှာ ၄ ခုကနေ ၆ ခုအထိ ကျစ်ကျစ်လစ်လစ် ပေါ်မယ့်စနစ်) -->
            <div class="row g-3" id="productGrid">
                <!-- Google Sheet မှ အချက်အလက်များကို ဤနေရာတွင် လာပြပါမည် -->
                <div class="text-center my-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">အချက်အလက်များ ဆွဲယူနေပါသည်...</p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<!-- ၄။ JavaScript Section -->
<script>
    // သင့် Google Sheet မှ ရလာသော CSV Link ကို အောက်ပါနေရာတွင် ထည့်ပါ
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1OdWkVx1IIra7fZ2vXZhA7xlBKfSji5fc0Sp-GH6eQDc/export?format=csv'; 
    
    let allProducts = []; // Data တွေကို Memory ထဲ သိမ်းထားဖို့ Variable

    // Google Sheet မှ Data လှမ်းယူခြင်း
    async function loadProducts() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            
            // Google ရဲ့ internal code တွေ ပါလာရင် ဖယ်ထုတ်ဖို့ စစ်ဆေးခြင်း
            if (data.includes('<!DOCTYPE') || data.includes('google.docs')) {
                throw new Error("ကျေးဇူးပြု၍ မှန်ကန်သော CSV Export Link ကို သုံးပေးပါ။");
            }

            const rows = data.split('\n').slice(1); 
            const grid = document.getElementById('productGrid');
            const vendors = new Set(); 
            
            allProducts = []; 

            rows.forEach(row => {
                const columns = row.split(',');
                // Column ၅ ခု မပြည့်ရင် သို့မဟုတ် code နဲ့ name မပါရင် မထည့်ဘူး
                if(columns.length < 5 || !columns[0] || columns[0].includes('<!DOC')) return; 

                const p = {
                    code: columns[0] ? columns[0].trim().replace(/"/g, "") : '',
                    en: columns[1] ? columns[1].trim().replace(/"/g, "") : '',
                    mm: columns[2] ? columns[2].trim().replace(/"/g, "") : '',
                    vendor: columns[3] ? columns[3].trim().replace(/"/g, "") : '',
                    img: columns[4] ? columns[4].trim().replace(/"/g, "") : ''
                };

                if(p.code) {
                    allProducts.push(p);
                    if(p.vendor) vendors.add(p.vendor);
                }
            });

            renderProducts(allProducts);
            renderVendors(vendors);

        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('productGrid').innerHTML = `<div class="alert alert-danger w-100">Google Sheet Link မှားယွင်းနေပါသည်။ Link ကို /export?format=csv ပုံစံပြောင်းလဲပြီး ပြန်စမ်းကြည့်ပါ။</div>`;
        }
    }

    // HTML Cards များ တည်ဆောက်ပြသခြင်း
    function renderProducts(productsList) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = ''; 

        if(productsList.length === 0) {
            grid.innerHTML = `<div class="text-center text-muted my-5 w-100">ရှာဖွေမှုမတွေ့ပါ။</div>`;
            return;
        }

        productsList.forEach(p => {
            grid.innerHTML += `
                <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 mb-3 product-item" data-vendor="${p.vendor}">
                    <div class="card h-100 shadow-sm border-0 product-card">
                        <div class="p-2">
                            <img src="${p.img}" class="card-img-top rounded" alt="${p.en}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        </div>
                        <div class="card-body p-2 text-center">
                            <h6 class="text-primary small mb-1" style="font-size: 0.75rem;">${p.code}</h6>
                            <div class="card-title-area">
                                <p class="fw-bold mb-0 text-dark text-truncate-2" style="font-size: 0.85rem; line-height: 1.2;">${p.en}</p>
                                <p class="text-muted small mb-1 text-truncate" style="font-size: 0.78rem;">${p.mm}</p>
                            </div>
                            <span class="badge bg-light text-dark border mt-1" style="font-size: 0.65rem;">${p.vendor}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // Sidebar Vendor Buttons များ တည်ဆောက်ခြင်း
    function renderVendors(vendorSet) {
        const vendorListDiv = document.getElementById('vendorList');
        // 'အားလုံး' ခလုတ်ကလွဲလို့ ကျန်တာရှင်းမယ်
        vendorListDiv.innerHTML = `<button class="list-group-item list-group-item-action active shadow-none" onclick="filterVendor('all', this)">အားလုံး</button>`;
        
        vendorSet.forEach(vendor => {
            vendorListDiv.innerHTML += `<button class="list-group-item list-group-item-action shadow-none" onclick="filterVendor('${vendor}', this)">${vendor}</button>`;
        });
    }

    // instant Search စနစ် (နာမည်၊ ကုတ်၊ စာလုံးအစဖြင့် ရှာနိုင်သည်)
    function searchProduct() {
        let input = document.getElementById('searchInput').value.toLowerCase().trim();
        
        // ဘေးတန်း ခလုတ်တွေကို Active ဖြုတ်ပြီး 'အားလုံး' ကို ပြန်ရွေးပေးခြင်း
        const buttons = document.querySelectorAll('#vendorList button');
        buttons.forEach(btn => btn.classList.remove('active'));
        buttons[0].classList.add('active');

        let filtered = allProducts.filter(p => {
            return p.en.toLowerCase().includes(input) || 
                   p.mm.toLowerCase().includes(input) || 
                   p.code.toLowerCase().includes(input);
        });
        
        renderProducts(filtered);
    }

    // Vendor အလိုက် Filter လုပ်ခြင်း
    function filterVendor(vendorName, element) {
        // Search Box ကို ပြန်ရှင်းမယ်
        document.getElementById('searchInput').value = '';

        // Active Button အရောင် ပြောင်းလဲခြင်း
        const buttons = document.querySelectorAll('#vendorList button');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        if (vendorName === 'all') {
            renderProducts(allProducts);
        } else {
            let filtered = allProducts.filter(p => p.vendor === vendorName);
            renderProducts(filtered);
        }
    }

    // စာမျက်နှာ စပွင့်တာနဲ့ Run မယ်
    loadProducts();
</script>

</body>
</html>
