<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST.LOTUS SUPERMARKET Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-card { transition: transform 0.2s; border: 1px solid #eee !important; border-radius: 12px; overflow: hidden; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
    .vendor-sidebar { position: sticky; top: 80px; }
    .product-img { height: 180px; width: 100%; object-fit: contain; padding: 10px; background-color: #ffffff; }
/* ၁။ Website တစ်ခုလုံးကို ပုံသေ အကျယ်သတ်မှတ်ခြင်း */
body {
    min-width: 1600px !important; /* Zoom ဘယ်လောက်ဆွဲဆွဲ ဒီအကျယ်အောက် မကျသွားအောင် တားထားတာပါ */
    overflow-x: auto !important;
    background-color: #f8f9fa;
}
/* ၂။ Sidebar နဲ့ Main Content ကို Flex နဲ့ ခွဲခြင်း (ပုံ ၁ ထပ်နေတာကို ဖြေရှင်းရန်) */
.container-fluid {
    display: flex !important;
    flex-wrap: nowrap !important; /* ဘယ်လိုမှ အောက်ကို ဆင်းမသွားအောင်ပါ */
    width: 1600px;
    margin: 0 auto;
}
/* ၃။ ဘယ်ဘက် Sidebar ကို အသေထားခြင်း */
.vendor-sidebar {
    width: 280px !important;
    min-width: 280px !important;
    position: sticky;
    top: 20px;
    height: 90vh;
    overflow-y: auto;
    flex-shrink: 0; /* Zoom ချဲ့ရင်လည်း ကျုံ့မသွားအောင်ပါ */
}
/* Product Card ကို ပုံ ၂ အတိုင်း ပြားပြားလေးနဲ့ Modern ဖြစ်အောင် ပြင်ခြင်း */
.product-card {
    width: 300px !important;
    border: none !important;
    border-radius: 0 !important; /* ဒေါင့်ချိုးဖျောက်ပါ */
    margin: 15px !important;
    background: #fff;
    transition: transform 0.3s ease;
}

.product-card:hover {
    transform: translateY(-10px);
}

.product-img {
    height: 250px !important;
    background-color: #f8f8f8;
    object-fit: contain;
    padding: 20px;
}
/* Container ကို အလယ်တည့်တည့်ပြန်ပို့ခြင်း */
#product-container {
    display: flex !important;
    flex-wrap: wrap;
    justify-content: center;
    padding: 40px 0;
    max-width: 1400px;
    margin: 0 auto !important;
}
/* ၆။ Stock Code ကို Card ရဲ့ အောက်ခြေမှာ အမြဲရှိနေစေရန် */
.card-body {
    display: flex;
    flex-direction: column;
    height: 100%;
}
.stock-code {
    margin-top: auto;           /* စာသားတွေ ဘယ်လောက်တိုတို အောက်ခြေကို တွန်းချထားမှာပါ */
    font-weight: bold;
    color: #d9534f;
    padding-top: 15px;
}
#loginOverlay {
    position: fixed !important; /* Screen ပေါ်မှာ အမြဲကပ်နေစေဖို့ပါ */
    top: 0;
    left: 0;
    width: 100vw !important;    /* Browser ရဲ့ အကျယ်အပြည့် ယူလိုက်တာပါ */
    height: 100vh !important;   /* Browser ရဲ့ အမြင့်အပြည့် ယူလိုက်တာပါ */
    background-color: rgba(255, 255, 255, 0.98); /* နောက်ခံကို အဖြူရောင် ခပ်ပျစ်ပျစ် ထားပါ */
    display: flex;
    justify-content: center;    /* Login Box ကို အလယ်တည့်တည့် ရောက်စေဖို့ပါ */
    align-items: center;        /* Login Box ကို အလယ်တည့်တည့် ရောက်စေဖို့ပါ */
    z-index: 99999 !important;  /* အခြားအရာအားလုံးရဲ့ အပေါ်မှာ ရှိနေစေဖို့ပါ */
}
.login-box {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 350px;               /* Login Box ရဲ့ အကျယ်ကို ပုံသေထားပါ */
    text-align: center;
}
/* ပုံများကို တစ်တန်းတည်း ညီစီစေရန် (CSS Grid) */
.hero-image-grid-container {
    width: 100% !important;
    display: flex;
    justify-content: center;
    padding-bottom: 20px;
}

.hero-image-grid {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap; /* Screen သေးရင် အောက်ဆင်းပေးဖို့ပါ */
}

.hero-img-box {
    background: rgba(255, 255, 255, 0.15); /* အဖြူရောင်ဖျော့ဖျော့လေး နောက်ခံထားပါ */
    padding: 15px;
    border-radius: 15px;
    width: 140px;
    text-align: center;
    transition: 0.3s;
}

.hero-img-box:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-5px);
}

.hero-img-box img {
    height: 80px; /* ပုံရဲ့ အမြင့်ကို ထိန်းချုပ်ပါ */
    width: auto;
    margin-bottom: 10px;
}

.img-label {
    color: white;
    font-size: 12px;
    font-weight: bold;
    display: block;
}
  </style>
</head>
<body class="bg-light">

  <div id="loginOverlay">
    <div class="card shadow-lg p-4 text-center" style="max-width: 380px; width: 90%; border-radius: 15px;">
      <h3 class="fw-bold mb-2">ST.LOTUS</h3>
      <p class="text-muted mb-4 small">Inventory Access Control</p>
      <input type="password" id="staffPassword" class="form-control mb-3 py-2 text-center" placeholder="Password ရိုက်ထည့်ပါ">
      <button class="btn btn-dark w-100 py-2" onclick="checkPassword()">Login</button>
      <p id="loginError" class="text-danger small mt-3" style="display: none;">❌ Password မှားနေပါသည်။</p>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">ST.LOTUS SUPERMARKET</a>
      <div class="ms-auto d-flex align-items-center">
          <div class="input-group" style="width: 300px;">
              <input type="text" class="form-control bg-light border-0" placeholder="Search product...">
          </div>
      </div>
    </div>
  </nav>

  <div class="hero-section bg-black text-white py-5">
    <div class="container py-5">
        <p class="text-danger mb-2">အခုပဲ လာရောက်ဝယ်ယူနိုင်ပါပြီ။</p>
        <h1 class="display-3 fw-bold">သင်နှစ်သက်သမျှ အရာအားလုံးကို<br>တစ်နေရာတည်းမှာ ရရှိနိုင်ဖို့။</h1>
        <button class="btn btn-primary px-4 py-2 mt-4 rounded-0">အခုပဲ ဝယ်ယူရန်</button>
    </div>
  </div>

  <div class="container-fluid px-4 mt-4">
    <div class="row">
      <div class="col-md-3 mb-4">
        
      <div class="col-md-9">
        <div class="input-group mb-4 shadow-sm">
          <span class="input-group-text bg-white border-end-0">🔍</span>
          <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="ရှာဖွေရန်...">
        </div>
  <div class="row" id="productGrid">
  
  <div class="hero-image-grid-container mt-5">
    <div class="hero-image-grid">
        <div class="hero-img-box">
            <img src="https://www.pngarts.com/files/3/Coca-Cola-PNG-Image-with-Transparent-Background.png" alt="Drink">
            <span class="img-label">Soft Drinks</span>
        </div>
        <div class="hero-img-box">
            <img src="https://www.pngmart.com/files/7/Headphone-PNG-Transparent-Picture.png" alt="Headphone">
            <span class="img-label">Electronics</span>
        </div>
        <div class="hero-img-box">
            <img src="https://www.pngarts.com/files/4/Potato-Chips-PNG-Transparent-Image.png" alt="Snack">
            <span class="img-label">Snacks</span>
        </div>
        <div class="hero-img-box">
            <img src="https://www.pngmart.com/files/16/Liquid-Detergent-Bottle-PNG-Transparent.png" alt="Home">
            <span class="img-label">Household</span>
        </div>
        <div class="hero-img-box">
            <img src="https://www.pngmart.com/files/2/Shampoo-PNG-Transparent-Image.png" alt="Care">
            <span class="img-label">Personal Care</span>
        </div>
    </div>
</div>
  <script>
    let allProducts = []; 
    let activeVendor = 'အားလုံး';

    // Password စစ်ဆေးသည့် Function
    function checkPassword() {
      const inputPass = document.getElementById('staffPassword').value;
      const correctPass = "lotus123"; // သင်သတ်မှတ်ထားသော Password

      if (inputPass === correctPass) {
        document.getElementById('loginOverlay').style.display = 'none'; // Login အကွက်ဖျောက်ခြင်း
        loadProducts(); // Password မှန်မှ Data စဆွဲခြင်း
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    // Enter Key နှိပ်ရင်လည်း Login ဝင်စေရန်
    document.getElementById('staffPassword').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkPassword();
    });

    async function loadProducts() {
      try {
        const response = await fetch('https://supermarket-project-17xz.onrender.com/api/products');
        allProducts = await response.json();
        renderProducts(allProducts);
      } catch (error) {
        console.error("Error loading data:", error);
      }
    }

    // ပုံကို အကြီးပြရန်
    function openModal(src) {
      document.getElementById('imageModal').style.display = 'flex';
      document.getElementById('modalImg').src = src;
  }

    // ပုံကို ပြန်ပိတ်ရန်
      function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
  }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      if (products.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center mt-5 text-muted"><h5>ရှာဖွေနေသော ပစ္စည်းမရှိပါ။</h5></div>';
        return;
      }
      products.forEach(p => {
        grid.innerHTML += `
          <div class="col-md-4 col-lg-3 mb-4">
            <div class="card h-100 shadow-sm product-card border-0">
              <img src="${p.image_url}" 
                   class="card-img-top product-img" 
                   style="cursor: pointer;" 
                   onclick="openModal('${p.image_url}')"
                   onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
              <div class="card-body">
                <h6 class="text-primary small fw-bold">${p.category || 'General'}</h6>
                <h5 class="card-title h6 fw-bold">${p.name_en}</h5>
                <p class="stock-code-container">${p.name_mm}</p>
                <div class="d-flex justify-content-between align-items-center mt-3">
                  <span class="fw-bold text-danger" style="font-size: 0.85rem;">Stock: ${p.price}</span>
                  <span class="badge bg-light text-dark border small">${p.vendor || 'Unknown'}</span>
                </div>
              </div>
            </div>
          </div>`;
      });
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => {
        const nameEN = (p.name_en || "").toLowerCase();
        const nameMM = (p.name_mm || "");
        const productVendor = (p.vendor || "").trim();
        const matchesSearch = nameEN.includes(searchTerm) || nameMM.includes(searchTerm);
        const matchesVendor = (activeVendor === 'အားလုံး') || (productVendor === activeVendor);
        return matchesSearch && matchesVendor;
      });
      renderProducts(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    document.querySelectorAll('.list-group-item').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelectorAll('.list-group-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        activeVendor = this.innerText.trim();
        applyFilters();
      });
    });

    // loadProducts() ကို ဤနေရာမှ ဖြုတ်လိုက်ပါပြီ (Password မှန်မှ ခေါ်မည်ဖြစ်သောကြောင့်ဖြစ်သည်)
  </script>
    <div id="imageModal" style="display: none; position: fixed; z-index: 10000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; cursor: zoom-out;" onclick="closeModal()">
    <span style="position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer;">&times;</span>
    <img id="modalImg" style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
  </div>
</body>
</html>
