<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST. LOTUS SUPERMARKET - Inventory</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .product-card { 
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .product-card:hover { 
            transform: scale(1.03);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
        .vendor-sidebar { 
            position: sticky; 
            top: 70px; 
        }
        .card-img-top {
            height: 140px !important;
            object-fit: contain;
            background-color: #f8f9fa;
        }
        .card-title-area {
            min-height: 42px;
        }
    </style>
</head>
<body class="bg-light">

<!-- Login Modal (Login မဝင်မချင်း ပိတ်ထားမည့် Screen) -->
<div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold">ST. LOTUS SUPERMARKET - Login</h5>
            </div>
            <div class="modal-body p-4">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label text-muted">Username</label>
                        <input type="text" id="username" class="form-control py-2" required placeholder="အကောင့်အမည် ထည့်ပါ">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" id="password" class="form-control py-2" required placeholder="စကားဝှက် ထည့်ပါ">
                    </div>
                    <div id="loginError" class="alert alert-danger d-none py-2" role="alert">
                        Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login ဝင်မည်</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="https://via.placeholder.com/40" alt="Logo" width="40" height="40" class="d-inline-block align-text-top me-2 rounded">
            <strong>ST. LOTUS SUPERMARKET</strong>
        </a>
        <!-- အကောင့်အမည် နှင့် Logout ခလုတ် -->
        <div class="d-flex align-items-center">
            <span id="userGreeting" class="text-white me-3 small d-none fw-bold"></span>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm d-none" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</nav>

<!-- Dashboard Main Layout -->
<div class="container-fluid px-4 mt-4">
    <div class="row">
        
        <!-- Sidebar Vendors -->
        <div class="col-xl-2 col-md-3 mb-4">
            <div class="vendor-sidebar">
                <h5 class="fw-bold text-muted mb-3" style="font-size: 1.1rem;">Main Vendors</h5>
                <div class="list-group shadow-sm" id="vendorList">
                    <button class="list-group-item list-group-item-action active" onclick="filterVendor('all', this)">အားလုံး</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-xl-10 col-md-9">
            
            <!-- Search Bar -->
            <div class="input-group mb-4 shadow-sm">
                <span class="input-group-text bg-white border-end-0">🔍</span>
                <input type="text" id="searchInput" class="form-control border-start-0 py-2" placeholder="အမည် (သို့) ကုတ် (သို့) အစစာလုံးဖြင့် ရှာရန်..." onkeyup="searchProduct()">
            </div>

            <!-- Product Grid -->
            <div class="row g-3" id="productGrid">
                <div class="text-center my-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">အချက်အလက်များ ဆွဲယူနေပါသည်...</p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<!-- Image Modal (ပုံကြီးချဲ့ပြသည့် Popup) -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 text-center position-relative">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                <img src="" id="modalImage" class="img-fluid rounded shadow-lg" style="max-height: 80vh; object-fit: contain; background-color: #fff;">
                <div id="modalCaption" class="text-white mt-2 fw-bold fs-5"></div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Logic -->
<script>
    // သင့် Google Sheet CSV Link ကို အောက်ပါနေရာတွင် ထည့်ပါ
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio8D-MWOZYDRzX_j7hv79fPpIHW93zOPKtAJGNoqJ_5pkAT1YYnp8yoPwL7wozgiIfXxHKSHwQZj/pub?output=csv'; 
    
    let allProducts = [];

    async function loadProducts() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            
            const rows = data.split('\n').slice(1); 
            const grid = document.getElementById('productGrid');
            const vendors = new Set(); 
            
            allProducts = []; 

            rows.forEach(row => {
                const columns = row.split(',');
                if(columns.length < 5 || !columns[0]) return; 

                const p = {
                    code: columns[0] ? columns[0].trim().replace(/"/g, "") : '',
                    en: columns[1] ? columns[1].trim().replace(/"/g, "") : '',
                    mm: columns[2] ? columns[2].trim().replace(/"/g, "") : '',
                    vendor: columns[3] ? columns[3].trim().replace(/"/g, "") : '',
                    img: columns[4] ? columns[4].trim().replace(/"/g, "") : ''
                };

                if(p.code) {
                    allProducts.push(p);
                    if(p.vendor) vendors.add(p.vendor);
                }
            });

            renderProducts(allProducts);
            renderVendors(vendors);

        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('productGrid').innerHTML = `<div class="alert alert-danger w-100">Google Sheet မှ Data ဆွဲယူ၍ မရပါ။ CSV Link မှန်မမှန် ပြန်စစ်ပေးပါ၊၊</div>`;
        }
    }

    function renderProducts(productsList) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = ''; 

        if(productsList.length === 0) {
            grid.innerHTML = `<div class="text-center text-muted my-5 w-100">ရှာဖွေမှုမတွေ့ပါ။</div>`;
            return;
        }

        productsList.forEach(p => {
            grid.innerHTML += `
                <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 mb-3 product-item">
                    <div class="card h-100 shadow-sm border-0 product-card">
                        <div class="p-2 text-center">
                            <img src="${p.img}" class="card-img-top rounded" alt="${p.en}" 
                                 style="cursor: pointer;" 
                                 onclick="zoomImage('${p.img}', '${p.en} (${p.mm})')"
                                 onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        </div>
                        <div class="card-body p-2 text-center">
                            <h6 class="text-primary small mb-1" style="font-size: 0.75rem;">${p.code}</h6>
                            <div class="card-title-area">
                                <p class="fw-bold mb-0 text-dark text-truncate-2" style="font-size: 0.85rem; line-height: 1.2;">${p.en}</p>
                                <p class="text-muted small mb-1 text-truncate" style="font-size: 0.78rem;">${p.mm}</p>
                            </div>
                            <span class="badge bg-light text-dark border mt-1" style="font-size: 0.65rem;">${p.vendor}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function renderVendors(vendorSet) {
        const vendorListDiv = document.getElementById('vendorList');
        vendorListDiv.innerHTML = `<button class="list-group-item list-group-item-action active shadow-none" onclick="filterVendor('all', this)">အားလုံး</button>`;
        
        vendorSet.forEach(vendor => {
            vendorListDiv.innerHTML += `<button class="list-group-item list-group-item-action shadow-none" onclick="filterVendor('${vendor}', this)">${vendor}</button>`;
        });
    }

    function searchProduct() {
        let input = document.getElementById('searchInput').value.toLowerCase().trim();
        
        const buttons = document.querySelectorAll('#vendorList button');
        buttons.forEach(btn => btn.classList.remove('active'));
        if(buttons[0]) buttons[0].classList.add('active');

        let filtered = allProducts.filter(p => {
            return p.en.toLowerCase().includes(input) || 
                   p.mm.toLowerCase().includes(input) || 
                   p.code.toLowerCase().includes(input);
        });
        
        renderProducts(filtered);
    }

    function filterVendor(vendorName, element) {
        document.getElementById('searchInput').value = '';

        const buttons = document.querySelectorAll('#vendorList button');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        if (vendorName === 'all') {
            renderProducts(allProducts);
        } else {
            let filtered = allProducts.filter(p => p.vendor === vendorName);
            renderProducts(filtered);
        }
    }

    // Image Zoom Modal Function
    function zoomImage(imgSrc, productName) {
        document.getElementById('modalImage').src = imgSrc;
        document.getElementById('modalCaption').innerText = productName;
        
        var myModal = new bootstrap.Modal(document.getElementById('imageModal'));
        myModal.show();
    }

    // ခွင့်ပြုထားသော အကောင့်များနှင့် စကားဝှက်များ
    const users = {
        "admin": "123456",
        "staff": "stlotus2024",
        "manager": "lotus@123"
    };

    let loginModalObj;

    // Page ပွင့်ပွင့်ချင်း Login စစ်မည်
    document.addEventListener("DOMContentLoaded", function() {
        loginModalObj = new bootstrap.Modal(document.getElementById('loginModal'));
        
        const isLoggedIn = sessionStorage.getItem("isLoggedIn");
        const currentUser = sessionStorage.getItem("currentUser");

        if (!isLoggedIn) {
            loginModalObj.show();
        } else {
            showUserInterface(currentUser);
            loadProducts(); // Login ဝင်ထားမှ Data ဆွဲယူမည်
        }
    });

    // Login ဝင်သည့် စနစ်
    function handleLogin(event) {
        event.preventDefault();
        const userInput = document.getElementById('username').value.trim();
        const passInput = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('loginError');

        if (users[userInput] && users[userInput] === passInput) {
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("currentUser", userInput);
            
            errorDiv.classList.add('d-none');
            loginModalObj.hide();
            
            showUserInterface(userInput);
            loadProducts();
        } else {
            errorDiv.classList.remove('d-none');
        }
    }

    // User ဝင်ထားကြောင်း UI ပြောင်းလဲခြင်း
    function showUserInterface(username) {
        document.getElementById('userGreeting').innerText = `👤 ${username}`;
        document.getElementById('userGreeting').classList.remove('d-none');
        document.getElementById('logoutBtn').classList.remove('d-none');
    }

    // Logout ထွက်သည့် စနစ်
    function handleLogout() {
        sessionStorage.clear();
        location.reload();
    }
</script>

</body>
</html>
